<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Governance Baseline — AI Risk Practice</title>
    <script>
      // GitHub Pages SPA fallback — redirect to index with path encoded
      // so BrowserRouter can handle the route client-side
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      const redirectUrl = '/?redirect=' + encodeURIComponent(path + search + hash);
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>

version: 2

# Security updates are on in repo settings. This adds weekly version updates,
# grouped to keep PR noise down, and covers the workflow actions. Mirrors
# ai-risk-kb and ai-risk-training.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # vite and @vitejs/plugin-react pin each other's majors, so separate
      # PRs can never pass CI. Keep them in one PR (listed first so it wins).
      vite-toolchain:
        patterns: ["vite", "@vitejs/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

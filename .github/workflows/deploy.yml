name: Check and deploy

# Checks run on every pull request and push. A push to main also deploys to
# Cloudflare Pages (project ai-risk-baseline), which serves
# baseline.airiskpractice.org since the move off GitHub Pages on 17 Nov 2026.
#
# Deploying needs CLOUDFLARE_API_TOKEN (a token with only "Account ·
# Cloudflare Pages · Edit") and CLOUDFLARE_ACCOUNT_ID, stored as secrets of
# the "production" environment, which is limited to the main branch. Until
# they exist the deploy job says so and stops without failing the run.
#
# The token is handed only to the publish step, never to npm ci or the build,
# so no installed package can read it, and Wrangler is pinned to an exact
# version.
#
# Cloudflare Pages serves index.html for unknown paths when the build has no
# 404.html, which is what BrowserRouter needs. The old GitHub Pages 404.html
# redirect is gone; App.jsx still accepts ?redirect= for old links.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate data files
        run: node scripts/validate-data.js

      - name: Run engine QA
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://baseline.airiskpractice.org/
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed. Add both as secrets of the production environment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: "24"
          cache: "npm"
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npm run build
      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.163.0 pages deploy dist --project-name=ai-risk-baseline --branch=main --commit-dirty=true

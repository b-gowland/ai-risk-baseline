name: URL Health Check

on:
  schedule:
    - cron: "0 9 1 * *"  # First of every month at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-url-health
  cancel-in-progress: false

jobs:
  url-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check URLs in regulatory-mappings.json
        id: check
        run: node scripts/check-source-urls.js
        continue-on-error: true

      - name: Upload URL check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-url-health
          path: reports/url-health.*
          if-no-files-found: warn

      - name: Summarize results
        if: always()
        run: |
          if [ -f reports/url-health.md ]; then
            cat reports/url-health.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "URL checker failed before producing a report; inspect the logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report source links needing attention
        if: steps.check.outcome == 'failure' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('reports/url-health.md')
              ? fs.readFileSync('reports/url-health.md', 'utf8')
              : 'The URL checker failed before producing a report. Inspect the run logs.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${report}\n\n[Workflow run and full artifacts](${runUrl})`;
            const title = 'URL Health Check: source links need attention';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'maintenance',
            });
            const existing = issues.find(i => !i.pull_request && i.title.startsWith('URL Health Check:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body,
                labels: existing.labels.map(l => typeof l === 'string' ? l : l.name)
                  .filter(name => name !== 'broken-link'),
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
                labels: ['maintenance'],
              });
            }

      - name: Fail run when source links need attention
        if: steps.check.outcome == 'failure'
        run: exit 1

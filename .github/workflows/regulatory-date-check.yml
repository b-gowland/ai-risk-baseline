name: Regulatory Date Check

on:
  schedule:
    - cron: "0 9 1,15 * *"  # 1st and 15th of every month at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: regulatory-date-check
  cancel-in-progress: false

jobs:
  date-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Find effective dates passed since last verification
        id: check
        run: node scripts/check-date-crossings.js
        continue-on-error: true

      - name: Summarize results
        if: always()
        run: |
          if [ -f reports/date-crossings.md ]; then
            cat reports/date-crossings.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Date checker failed before producing a report; inspect the logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report mappings needing re-verification
        if: steps.check.outcome == 'failure' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('reports/date-crossings.md')
              ? fs.readFileSync('reports/date-crossings.md', 'utf8')
              : 'The date checker failed before producing a report. Inspect the run logs.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${report}\n\n[Workflow run](${runUrl})`;
            const title = 'Regulatory Date Check: mappings need re-verification';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'maintenance',
            });
            const existing = issues.find(i => !i.pull_request && i.title.startsWith('Regulatory Date Check:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
                labels: ['maintenance'],
              });
            }

      - name: Fail run when mappings need re-verification
        if: steps.check.outcome == 'failure'
        run: exit 1
